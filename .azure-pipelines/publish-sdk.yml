trigger:
  branches:
    include:
      - main
      
  tags:
    include:
      - v*

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildJob
        displayName: 'Build SDK Package'
        steps:
          - checkout: self
            fetchDepth: 0
            displayName: 'Checkout repository'

          - task: NodeTool@0
            inputs:
              versionSpec: '20.0'
            displayName: 'Install Node.js'

          - script: |
              npm install -g pnpm@9.0.0
            displayName: 'Install pnpm 9.0.0'

          - script: |
              pnpm install --frozen-lockfile
            displayName: 'Install dependencies'

          - script: |
              pnpm --filter vg-x07df run typecheck
            displayName: 'Type check SDK'

          - script: |
              pnpm --filter vg-x07df run build
            displayName: 'Build SDK package'

          - script: |
              ls -la packages/sdk/dist
            displayName: 'Verify build output'

          - publish: $(System.DefaultWorkingDirectory)/packages/sdk
            artifact: sdk-package
            displayName: 'Publish SDK artifact'

  - stage: Publish
    displayName: 'Publish to npm'
    dependsOn: Build
    condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'), startsWith(variables['Build.SourceBranch'], 'refs/tags/v')))
    jobs:
      - job: PublishJob
        displayName: 'Publish SDK to npm'
        steps:
          - checkout: none

          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Install Node.js'

          - download: current
            artifact: sdk-package
            displayName: 'Download SDK artifact'

          - script: |
              npm install -g pnpm@9.0.0
            displayName: 'Install pnpm 9.0.0'

          - script: |
              echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
              cat ~/.npmrc
            displayName: 'Configure npm authentication'
            env:
              NPM_TOKEN: $(NPM_TOKEN)

          - script: |
              cd $(Pipeline.Workspace)/sdk-package
              cat package.json | grep version
            displayName: 'Display package version'

          - script: |
              cd $(Pipeline.Workspace)/sdk-package
              npm publish --access public --ignore-scripts
            displayName: 'Publish to npm registry'
            env:
              NPM_TOKEN: $(NPM_TOKEN)

          - script: |
              echo "Successfully published vg-x07df to npm"
            displayName: 'Publish success message'
